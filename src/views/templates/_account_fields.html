{# Shared fields for /users/new (Create HR) and /setup. `form` holds the values to re-show. #}
<div class="auth-grid">
  <label>Full name (email signature)
    <input name="name" value="{{ form.name or '' }}" required placeholder="e.g. Somchai Jaidee (ชัย)"></label>
  <label>First name
    <input name="firstname" value="{{ form.firstname or '' }}" placeholder="e.g. Somchai"></label>
</div>
<label>Work email
  <input type="email" name="email" value="{{ form.email or '' }}" required placeholder="name@freewillsolutions.com"></label>
<div class="auth-grid">
  <label>Username
    <input name="username" value="{{ form.username or '' }}" required autocomplete="username"
           pattern="[A-Za-z._\-]{1,50}" title="1-50 letters, dots, dashes or underscores"></label>
  <label>Folder prefix <span class="muted">(mail folders, e.g. Na)</span>
    <input name="prefix" value="{{ form.prefix or '' }}" required maxlength="20" placeholder="e.g. Sc"></label>
</div>
<div class="auth-grid">
  <label>Password
    <input type="password" name="password" required autocomplete="new-password"></label>
  <label>Confirm password
    <input type="password" name="confirm" required autocomplete="new-password"></label>
</div>
<div class="auth-grid">
  <label>Mobile
    <input type="tel" name="mobile" data-phone="mobile" value="{{ form.mobile or '' }}" placeholder="081-234-5678"></label>
  <label>Tel
    <input type="tel" name="tel" data-phone="tel" value="{{ form.tel or '' }}" placeholder="0-2034-4147"></label>
</div>
