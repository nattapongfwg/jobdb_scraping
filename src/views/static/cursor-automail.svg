<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#f4f6f8"/>
      <stop offset=".35" stop-color="#c2c9d1"/>
      <stop offset=".6"  stop-color="#9aa3ad"/>
      <stop offset="1"   stop-color="#5b636c"/>
    </linearGradient>
    <linearGradient id="steel2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#dfe4e9"/>
      <stop offset="1"   stop-color="#6f777f"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0"  stop-color="#ff6b62"/>
      <stop offset=".5" stop-color="#c1272d"/>
      <stop offset="1"  stop-color="#7a1414"/>
    </radialGradient>
  </defs>
  <!-- soft red transmutation glow behind the hand -->
  <g opacity=".55">
    <circle cx="20" cy="22" r="13" fill="#c1272d" opacity=".18"/>
  </g>
  <g stroke="#3a4047" stroke-width="1" stroke-linejoin="round">
    <!-- extended index finger (pointing tip = hotspot ~6,2) -->
    <path d="M7 4 L13 13 L9 17 L5 9 Z" fill="url(#steel)"/>
    <line x1="8.5" y1="9" x2="11" y2="13" stroke="#3a4047" stroke-width=".8"/>
    <!-- palm / gauntlet plate -->
    <path d="M9 16 L20 12 L31 18 L31 27
             Q31 33 25 35 L16 36
             Q9 36 8 29 L7.5 20 Z" fill="url(#steel2)"/>
    <!-- knuckle plates -->
    <path d="M20 12 L24 11 L25 16 L21 17 Z" fill="url(#steel)"/>
    <path d="M24 11 L28 13 L29 18 L25 16 Z" fill="url(#steel)"/>
    <path d="M28 13 L31 18 L31 22 L29 18 Z" fill="url(#steel)"/>
    <!-- segmented finger lines -->
    <line x1="11" y1="22" x2="29" y2="22" stroke="#5b636c" stroke-width=".8"/>
    <line x1="13" y1="28" x2="28" y2="28" stroke="#5b636c" stroke-width=".8"/>
    <!-- thumb -->
    <path d="M9 16 L6 22 L9 27 L12 22 Z" fill="url(#steel)"/>
  </g>
  <!-- glowing alchemic core rivet on the palm -->
  <circle cx="19" cy="24" r="3" fill="url(#core)" stroke="#3a4047" stroke-width=".8"/>
  <circle cx="19" cy="24" r="1.1" fill="#ffd1cd"/>
</svg>
