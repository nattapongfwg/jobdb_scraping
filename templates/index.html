<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Postings — Recruitment</title>
<link rel="icon" type="image/png" href="/static/profile.png">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="logo"></span> Recruitment</div>
  <nav>
    <a href="/" class="active">Job Postings</a>
    <a href="/tracking">Status Tracking</a>
  </nav>
</div>

<div class="container full">
  <div class="page-head">
    <div>
      <h1 class="page-title">Job <span class="accent">Postings</span></h1>
      <p class="page-sub">Select a job to view its candidate pipeline.</p>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <a class="btn secondary" href="/email-templates">✉ Config Email Template</a>
      <a class="btn secondary" href="/request">📝 Request</a>
      <a class="btn secondary" href="/tracking">📊 Status Tracking</a>
    </div>
  </div>

  <!-- Scrape from SEEK -->
  <div class="scrape-panel">
    <div class="sp-head" onclick="toggleScrape()">
      <div>
        <h3>🔄 Scrape from SEEK</h3>
        <p class="sp-sub">Fetch your active job ads from the SEEK portal, then download a job's candidates into the database.</p>
      </div>
      <button class="btn ghost" id="spToggle">Open ▾</button>
    </div>
    <div class="scrape-body" id="scrapeBody">
      <div class="scrape-steps">
        <button class="btn" id="fetchBtn" onclick="fetchJobs()"><span class="step-num">1</span> Fetch active jobs</button>
        <input type="text" id="scrapeSearch" class="stage-search" style="width:200px;margin:0;display:none"
               placeholder="🔎 Filter jobs…" oninput="renderScrapeJobs()">
        <select id="scrapeJobs" disabled><option value="">— fetch jobs first —</option></select>
        <button class="btn" id="downloadBtn" onclick="downloadCandidates()" disabled><span class="step-num">2</span> Download candidates</button>
        <span class="scrape-status" id="scrapeStatus"></span>
      </div>
      <div class="scrape-progress" id="scrapeProgress" style="display:none">
        <div class="sp-bar"><div class="sp-bar-fill" id="spBarFill"></div></div>
        <div class="sp-prog-text" id="spProgText"></div>
      </div>
      <div class="scrape-log" id="scrapeLog"></div>
    </div>
  </div>

  <div class="tabs">
    <button id="tab-online" class="active" onclick="setTab('online')">
      Online <span class="tab-count" id="cnt-online">0</span>
    </button>
    <button id="tab-offline" onclick="setTab('offline')">
      Offline <span class="tab-count" id="cnt-offline">0</span>
    </button>
  </div>

  <div class="job-list" id="jobList">
    <div class="empty-state">Loading…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let jobs = [], currentTab = "online";

function toast(msg, ms=3000){ const t=$("#toast"); t.textContent=msg; t.style.display="block";
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.display="none", ms); }

async function load(){
  jobs = await (await fetch("/api/jobs")).json();
  render();
}
function byStatus(active){ return jobs.filter(j => !!j.is_active === active); }

function render(){
  $("#cnt-online").textContent = byStatus(true).length;
  $("#cnt-offline").textContent = byStatus(false).length;
  const list = currentTab === "online" ? byStatus(true) : byStatus(false);
  const box = $("#jobList");
  if(!list.length){ box.innerHTML = `<div class="empty-state">No ${currentTab} Job postings.${jobs.length?"":" Run the scraper first."}</div>`; return; }
  box.innerHTML = list.map(j => {
    const status = j.is_active
      ? `<span class="status online"><span class="dot">●</span> Online</span>`
      : `<span class="status offline"><span class="dot">●</span> Offline</span>`;
    const meta = [esc(j.location)||"—", j.scraped_at?("Updated "+esc(j.scraped_at)):null].filter(Boolean).join(" · ");
    const fresh = j.new ? `<span class="badge-new">${j.new} New</span>` : "";
    return `<a class="job-card" href="/job/${encodeURIComponent(j.job_id)}">
      <div>${status}
        <label class="switch" style="margin-top:8px" onclick="event.stopPropagation();event.preventDefault();toggleActive('${j.job_id}',this)">
          <input type="checkbox" ${j.is_active?"checked":""}> Active
        </label>
      </div>
      <div>
        <p class="job-name">${esc(j.title)||"(untitled)"}</p>
        <div class="job-meta">${meta}</div>
      </div>
      <div class="applicants">
        <div class="num">${j.applicants}${fresh}</div>
        <div class="lbl">Candidates</div>
      </div>
      <div class="go">›</div>
    </a>`;
  }).join("");
}

function setTab(tab){
  currentTab = tab;
  $("#tab-online").classList.toggle("active", tab==="online");
  $("#tab-offline").classList.toggle("active", tab==="offline");
  render();
}
window.setTab = setTab;

/* ---------------- Scrape from SEEK ---------------- */
let scrapePoll = null, scrapeJobsList = null;

// Rebuild the job dropdown from the fetched list, filtered by the search box.
function renderScrapeJobs(){
  const sel = $("#scrapeJobs"), search = $("#scrapeSearch");
  if(!scrapeJobsList){ return; }
  search.style.display = scrapeJobsList.length ? "" : "none";
  const q = search.value.trim().toLowerCase();
  const list = scrapeJobsList.filter(j =>
    q==="" || (j.title||"").toLowerCase().includes(q) || (j.job_id||"").toLowerCase().includes(q));
  if(!scrapeJobsList.length){
    sel.innerHTML = `<option value="">(no active jobs found)</option>`; sel.disabled = true;
  } else if(!list.length){
    sel.innerHTML = `<option value="">(no jobs match "${esc(search.value.trim())}")</option>`; sel.disabled = true;
  } else {
    sel.innerHTML = list.map(j => `<option value="${esc(j.job_id)}">${esc(j.title)||"(untitled)"} — ${esc(j.job_id)}</option>`).join("");
    sel.disabled = false;
  }
  $("#downloadBtn").disabled = !sel.value;
}
window.renderScrapeJobs = renderScrapeJobs;

function toggleScrape(){
  const body = $("#scrapeBody"); const open = body.classList.toggle("open");
  $("#spToggle").textContent = open ? "Close ▴" : "Open ▾";
}

async function fetchJobs(){
  $("#fetchBtn").disabled = true; $("#downloadBtn").disabled = true;
  setStatus("running", "Opening browser & logging in… (solve the CAPTCHA in the window if it appears)");
  await fetch("/api/scrape/fetch-jobs", {method:"POST"});
  startPolling();
}

async function downloadCandidates(){
  const jid = $("#scrapeJobs").value;
  if(!jid){ toast("Pick a job from the dropdown first."); return; }
  const title = $("#scrapeJobs").selectedOptions[0]?.textContent || jid;
  if(!confirm(`Download candidates + resumes for "${title}"?\nThis can take several minutes.`)) return;
  $("#fetchBtn").disabled = true; $("#downloadBtn").disabled = true;
  setStatus("running", "Downloading candidates…");
  await fetch("/api/scrape/download", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({job_id: jid})});
  startPolling();
}

function startPolling(){
  $("#scrapeLog").classList.add("show");
  clearInterval(scrapePoll);
  scrapePoll = setInterval(pollScrape, 1500);
  pollScrape();
}

function fmtDur(sec){
  if(sec==null) return "";
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m ? `${m}m ${s}s` : `${s}s`;
}

// Render the download progress bar from a status snapshot (download action only).
function renderProgress(s){
  const wrap=$("#scrapeProgress"), fill=$("#spBarFill"), txt=$("#spProgText");
  const show = s.action==="download" && (s.status==="running" || s.status==="done");
  if(!show){ wrap.style.display="none"; return; }
  wrap.style.display="";
  const p = s.progress || {}, done = p.done||0, total = p.total||0;
  if(total > 0){
    const pct = Math.min(100, Math.round(done/total*100));
    fill.classList.remove("indeterminate");
    fill.style.width = (s.status==="done" ? 100 : pct) + "%";
    if(s.status==="done"){ txt.textContent = `✔ ${done} candidate(s) in ${fmtDur(p.elapsed_sec)}`; }
    else {
      let t = `${done} / ${total} candidates (${pct}%)`;
      t += (p.eta_sec!=null && done>0) ? ` · ~${fmtDur(p.eta_sec)} left` : ` · estimating…`;
      txt.textContent = t;
    }
  } else {
    // Total unknown — show an indeterminate bar with a running count + elapsed.
    fill.classList.add("indeterminate"); fill.style.width = "40%";
    txt.textContent = s.status==="done"
      ? `✔ ${done} candidate(s) in ${fmtDur(p.elapsed_sec)}`
      : `${done} candidate(s)… ${fmtDur(p.elapsed_sec)} elapsed`;
  }
}

async function pollScrape(){
  let s; try { s = await (await fetch("/api/scrape/status")).json(); } catch(e){ return; }
  // live log
  if(s.log && s.log.length){ const el=$("#scrapeLog"); el.textContent=s.log.join("\n"); el.scrollTop=el.scrollHeight; }
  // job dropdown becomes available as soon as fetch returns the list
  if(s.jobs){ scrapeJobsList = s.jobs; renderScrapeJobs(); }
  renderProgress(s);
  if(s.status === "running"){
    setStatus("running", s.action==="download" ? "Downloading candidates…" : "Fetching active jobs…");
    return;
  }
  // finished (done | error | idle)
  clearInterval(scrapePoll); scrapePoll = null;
  $("#fetchBtn").disabled = false;
  $("#downloadBtn").disabled = !$("#scrapeJobs").value;
  if(s.status === "error"){ setStatus("error", "⚠ " + (s.error || "Scrape failed. See log above.")); }
  else if(s.status === "done"){
    if(s.action === "download"){ setStatus("done", "✔ Download complete — refreshing job list."); load(); }
    else { setStatus("done", s.jobs && s.jobs.length ? `✔ Found ${s.jobs.length} active job(s) — pick one above.` : "✔ Done — no active jobs found."); }
  } else { setStatus("", ""); }
}

function setStatus(cls, text){
  const el = $("#scrapeStatus");
  el.className = "scrape-status " + cls;
  el.innerHTML = (cls==="running" ? '<span class="spinner"></span>' : "") + esc(text);
}
window.toggleScrape = toggleScrape; window.fetchJobs = fetchJobs; window.downloadCandidates = downloadCandidates;

async function toggleActive(jobId, label){
  // preventDefault() (stops the card navigating) also cancels the checkbox's
  // native toggle, so flip it ourselves.
  const cb = label.querySelector("input");
  cb.checked = !cb.checked;
  await fetch("/api/jobs/active", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({job_id: jobId, is_active: cb.checked})});
  const j = jobs.find(x => x.job_id === jobId); if(j) j.is_active = cb.checked;
  toast(`Job marked ${cb.checked?"online (active)":"offline (inactive)"}.`);
  render();
}
window.toggleActive = toggleActive;

load();

// If a scrape is already in progress (e.g. after a page reload), resume showing it.
(async function resumeScrape(){
  try {
    const s = await (await fetch("/api/scrape/status")).json();
    if(s.status === "running" || (s.jobs && s.jobs.length)){
      $("#scrapeBody").classList.add("open"); $("#spToggle").textContent = "Close ▴";
      startPolling();
    }
  } catch(e){}
})();
</script>
<script src="{{ url_for('static', filename='fantasy.js') }}"></script>
</body>
</html>
