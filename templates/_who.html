{# Signed-in user + role in the top bar (every page); Admins also see how many
   registrations wait for approval. #}
{% if me %}
<div class="who">
  <span class="who-name" title="{{ me.email }}">👤 {{ me.name }}</span>
  <span class="who-role {{ me.role }}">{{ 'Admin' if me.role == 'admin' else 'HR' }}</span>
  {% if me.role == 'admin' and pending_users %}
  <a class="who-pending" href="/email-templates#users" title="Registrations waiting for your approval">{{ pending_users }} pending</a>
  {% endif %}
  <a class="who-out" href="/logout">Logout</a>
</div>
{% endif %}
