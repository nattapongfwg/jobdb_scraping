<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register — Recruitment</title>
<link rel="icon" type="image/png" href="/static/profile.png">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="topbar"><div class="brand"><span class="logo"></span> Recruitment</div></div>
<div class="auth-wrap">
  <form class="auth-card" method="post" action="/register">
    <h1 class="page-title">Register <span class="accent">HR account</span></h1>
    <p class="page-sub" style="margin-top:0">Your details become your email signature. An Admin approves the
      account before you can sign in.</p>
    {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
    {% include "_account_fields.html" %}
    <button class="btn" type="submit">Register</button>
    <p class="muted auth-foot">Already approved? <a href="/login">Sign in</a>.</p>
  </form>
</div>
</body>
</html>
